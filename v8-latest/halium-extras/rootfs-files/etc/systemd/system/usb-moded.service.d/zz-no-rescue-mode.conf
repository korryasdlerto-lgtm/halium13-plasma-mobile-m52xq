[Service]
# Base usb-moded.service always starts with Environment=USB_MODED_ARGS=-r
# (rescue mode) and relies on a one-time D-Bus signal
# (usb-early-init-done.service) to leave rescue mode -- but that signal
# is not queued for late subscribers, so every crash-restarted instance
# after the first one of a boot comes up in rescue mode and never gets
# told to leave it (see zz-rescue-off-every-restart.conf's own comment
# for the full investigation). That drop-in patches around it by
# resending the leave-rescue signal after every start, but the boot
# still failed to bring up SSH/network reliably even with that fix in
# place (2026-07-22). This addresses the root cause directly instead:
# drop the -r flag entirely so usb_moded starts straight into whatever
# mode is already persisted in its own config (developer/RNDIS mode,
# already set up earlier in this project via
# halium-force-usb-developer-mode.sh) -- no rescue-mode dance, no
# one-time-signal race, on every single start including crash-restarts.
Environment=USB_MODED_ARGS=
