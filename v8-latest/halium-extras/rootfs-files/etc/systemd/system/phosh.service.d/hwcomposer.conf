[Service]
Environment=ANDROID_ROOT=/android
Environment=HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64
# EGL_PLATFORM=hwcomposer is required for wlroots' GLES2 renderer autocreate
# to use the hwcomposer/hybris EGL platform instead of the generic GBM/DRM-FD
# path (which the hwcomposer backend doesn't support -> "no DRM FD available").
# Do NOT set WLR_RENDERER=pixman here -- with EGL_PLATFORM set correctly and
# /vendor + /system bind-mounted on the host (see 98-gpu-bridge.conf), GLES2
# succeeds and gives REAL Adreno GPU rendering (confirmed 2026-07-20: "GL
# renderer: Adreno (TM) 642L" in phoc's log, stable, survives cold reboot).
Environment=EGL_PLATFORM=hwcomposer
Environment=WLR_HWC_SKIP_VERSION_CHECK=1
