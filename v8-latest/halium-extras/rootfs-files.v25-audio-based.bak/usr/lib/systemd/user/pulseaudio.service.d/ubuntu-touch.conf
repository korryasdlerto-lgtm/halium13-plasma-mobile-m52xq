[Service]
# Force server-side corking when stalled (playback)
Environment=PULSE_PLAYBACK_CORK_STALLED=1

# Same HYBRIS_LD_LIBRARY_PATH/ANDROID_ROOT bridge env every other hybris-
# using host-side process needs (start-android-container, bluebinder_wait.sh,
# phosh.service, etc.) -- without it pulseaudio gets "library libc.so not
# found" -> "Unsupported Android version 0" from itself.
Environment=ANDROID_ROOT=/android
Environment=HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64
Environment=LD_PRELOAD=libtls-padding.so

# The installed pulseaudio-modules-droid-24 package was built against
# Android 7 (API 24) headers; this device's vendor audio_policy_
# configuration.xml uses schema/flags introduced later that the old XML
# parser aborts on entirely. Workaround: point module-droid-card-24 at a
# local copy of the same file with the offending mixPorts stripped --
# see /etc/pulse/halium-overrides/audio_policy_configuration.xml.
Environment=PULSE_MODULES_DROID_EXTRA_CARD_ARGS=config=/etc/pulse/halium-overrides/audio_policy_configuration.xml

# NOTE (Droidian/Phosh port, 2026-07-17): the original Ubuntu Touch version
# of this file also had PULSE_SCRIPT=/etc/pulse/touch.pa and an
# ExecStartPre=/usr/libexec/ubuntu-touch-session/get_pa_modules_droid_extra_args
# -- both stripped here since neither the touch.pa script nor that
# ubuntu-touch-session helper exist in this Debian+Phosh rootfs. If a
# droid-specific pulseaudio config script turns out to be needed, write a
# Debian-native equivalent and point PULSE_SCRIPT at it.
