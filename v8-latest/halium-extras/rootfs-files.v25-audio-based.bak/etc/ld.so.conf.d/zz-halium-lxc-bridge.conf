# FOUND 2026-07-29: getprop (and anything else linked against
# libhybris-common.so.1) needs /opt/halium-lxc-bridge/{system,vendor}-lib64
# in its library search path. A per-unit Environment=LD_LIBRARY_PATH=...
# drop-in (see usb-moded.service.d/zz-hybris-bridge-libs.conf) only covers
# processes systemd spawns directly for that ONE unit -- it does NOT cover
# subprocesses a running daemon execs later with its own (possibly
# sanitized/cleared) environment. Confirmed live: usb_moded itself starts
# fine with the drop-in (INIT DONE), but /data/usb-moded-debug.log still
# shows repeated "getprop: error while loading shared libraries:
# libhybris-common.so.1" during ongoing operation -- some later getprop
# invocation isn't inheriting the unit's Environment=. Same missing-path
# problem independently affects bluebinder_wait.sh/bluebinder_post.sh
# (bluebinder.service has no LD_LIBRARY_PATH override at all) and the
# lxc-android-config helper scripts (apply-sysctls, wait-and-detect-rild).
#
# System-wide ld.so.cache entry fixes ALL of these at once, for every
# caller regardless of environment inheritance. update-binary runs
# `chroot $ROOTFS_MNT ldconfig` right after injecting the bridge libs, so
# the cache is already correct at first boot -- no boot-time ordering
# dependency either.
/opt/halium-lxc-bridge/system-lib64
/opt/halium-lxc-bridge/vendor-lib64
