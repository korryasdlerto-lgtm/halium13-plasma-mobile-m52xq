[Unit]
# FOUND 2026-07-29, second pass: clearing RestartPreventExitStatus alone
# was NOT enough -- confirmed live, it still hit "Start request repeated
# too quickly" because the DEFAULT StartLimitBurst (5 within 10s) is way
# too tight once RestartSec=2 is added (5 retries * 2s = 10s, right at
# the edge of the default window). Same fix pattern as
# usb-moded.service's own zz-startlimit-retry.conf -- widen the window
# so it actually gets a real chance to retry until the rndis interface
# is ready.
StartLimitIntervalSec=120
StartLimitBurst=30

[Service]
# FOUND 2026-07-29: this rescue sshd binds to a fixed
# ListenAddress=10.15.19.82:8022 (the usb0/rndis address), but starts as
# soon as usb-moded triggers it -- if the rndis interface isn't
# configured with that address yet at that exact moment (After=
# network.target alone doesn't guarantee it), sshd fails to bind and
# exits 255. The base unit's RestartPreventExitStatus=255 explicitly
# blocks any retry on exactly that exit code, so a single early failure
# leaves nothing listening on 8022 for the rest of the boot -- matches
# the observed live pattern (ssh reachable briefly right after boot,
# then gone). Clear the exclusion so Restart=on-failure actually applies
# to 255 too, giving it a chance to succeed once the interface catches
# up.
RestartPreventExitStatus=
RestartSec=2
