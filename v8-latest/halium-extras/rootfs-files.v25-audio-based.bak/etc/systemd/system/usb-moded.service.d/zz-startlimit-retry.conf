[Unit]
# FOUND 2026-07-29: usb-moded.service (DefaultDependencies=no, starts very
# early via After=local-fs.target dbus.socket systemd-udev-settle.service
# sys-kernel-config.mount) has its ExecStartPre
# (/bin/sh /usr/libexec/usb-udc-cleanup.sh) fail with exit 127 on every
# single boot, confirmed live and reproducible with or without the
# halium-audio-fix-debs package install (rules out a package-transaction
# explanation) -- looks like a boot-order race where something the
# script's very first commands need (date/mkdir via bare $PATH lookup)
# isn't actually ready yet this early, even though the files exist on
# disk and work fine once the system is up. Default Restart=always with
# systemd's default RestartSec (100ms) retries 5 times in well under a
# second -- StartLimitBurst's default (5 within 10s) is hit before the
# race has any real chance to resolve, and usb-moded gives up for the
# rest of boot ("Start request repeated too quickly"), taking
# halium-force-usb-developer-mode.service (rndis+ssh) down with it via
# dependency failure -- this is the direct cause of "no network, no ssh"
# on a fresh boot. Spread retries out over a much longer window instead
# of trying to root-cause the exact early-boot race.
StartLimitIntervalSec=120
StartLimitBurst=30

[Service]
RestartSec=2
