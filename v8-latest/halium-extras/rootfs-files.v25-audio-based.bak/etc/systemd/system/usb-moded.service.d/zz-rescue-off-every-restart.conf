# FOUND 2026-07-21 (live test, /data/usb-moded-debug.log): usb_moded
# crash-loops repeatedly during boot (20+ "usb_moded 0.86.0+mer69 starting"
# lines in one boot, no fatal error text -- Type=notify + TimeoutSec=25
# most likely means it silently misses the sd_notify READY=1 deadline and
# systemd kills+restarts it under Restart=always).
#
# usb-moded.service's own Environment=USB_MODED_ARGS=-r starts EVERY
# instance in rescue mode (confirmed: the only override in
# /etc/default/usb-moded.d/device-specific-config.conf is commented out).
# Rescue mode is only lifted by two one-time D-Bus broadcasts
# (com.nokia.startup.signal.runlevel_switch_done / init_done), sent by
# /usr/libexec/usb-moded/turn-usb-rescue-mode-off -- which we already wire
# up via usb-early-init-done.service, but that unit is Type=oneshot +
# RemainAfterExit=yes + WantedBy=multi-user.target, so it fires EXACTLY
# ONCE PER BOOT. D-Bus signals are not queued for late subscribers, so
# only the very first usb_moded instance of the boot ever hears them --
# every instance after a crash-restart comes up in rescue mode and never
# gets told to leave it. This exactly matches the observed live pattern:
# our force-script's set_mode call briefly wins (rndis.usb0 for ~3s), then
# reverts, in a tight repeating cycle -- because the CURRENT usb_moded
# instance is still in unacknowledged rescue mode.
#
# turn-usb-rescue-mode-off is idempotent (the dbus-send calls are
# unconditional, only the one-time /run/systemd/boot-status/init-done
# timing marker is guarded) -- safe to call after every single start.
[Service]
ExecStartPost=/usr/libexec/usb-moded/turn-usb-rescue-mode-off

# REMOVED 2026-07-23: this used to also set
# Environment=USB_MODED_ARGS=-r -D for extra debug output, but that
# directly conflicts with zz-no-rescue-mode.conf's
# Environment=USB_MODED_ARGS= (empty) -- since drop-ins apply in
# filename order and this file sorts after zz-no-rescue-mode.conf, the
# -r flag here was winning and silently putting usb_moded back into
# rescue mode, undoing the root-cause fix. The ExecStartPost= above
# (idempotent, harmless either way) is kept; the conflicting
# Environment= line is dropped.
