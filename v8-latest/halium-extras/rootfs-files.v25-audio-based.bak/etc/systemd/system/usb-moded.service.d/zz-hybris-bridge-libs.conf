[Service]
# usb_moded needs the hybris/Android property bridge (libcutils.so) to
# read device properties correctly -- without this it falls back to its
# own property implementation and repeatedly fails internally
# (sig_usb_state_error_ind, confirmed live via -D debug logging), which
# combined with the rescue-mode-on-every-crash-restart issue (see
# zz-rescue-off-every-restart.conf) meant usb0/RNDIS + SSH never
# stabilized on a fresh boot even with the Android container fully
# disabled. Same bridge path already used by phosh.service,
# lxc-android-config.service, and repowerd.service -- just never
# applied here. Found + fixed live (2026-07-22).
Environment=HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64

# FOUND 2026-07-29: HYBRIS_LD_LIBRARY_PATH above only feeds hybris's own
# runtime dlopen() path -- it does nothing for a regular ELF binary like
# getprop, which is directly linked (DT_NEEDED) against
# libhybris-common.so.1 and resolved by the normal ld.so at exec time.
# Confirmed live (/userdata/usb-moded-debug.log): "getprop: error while
# loading shared libraries: libhybris-common.so.1: cannot open shared
# object file" -- getprop (called by ubports-usb-moded-configurator, part
# of usb-moded's own startup/config chain) fails outright without this,
# which is what actually produces the ExecStartPre exit 127 seen in
# journalctl. Plain LD_LIBRARY_PATH is what the standard dynamic linker
# actually reads.
Environment=LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64
