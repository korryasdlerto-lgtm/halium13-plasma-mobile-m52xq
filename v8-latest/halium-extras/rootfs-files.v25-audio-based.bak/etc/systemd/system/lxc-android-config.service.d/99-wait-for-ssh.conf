[Unit]
# Base unit sets Before=systemd-udev-trigger.service sysinit.target -- that
# forces the WHOLE rest of boot (network/dbus/ssh, all behind sysinit.target)
# to wait for this unit incl. any ExecStartPre sleep AND Restart=on-failure
# retry storm (confirmed live 2026-07-23: lxc.seccomp bug in a bad
# liblxc5.0.2-1+deb12u4 downgrade caused a 2+ minute retry storm here that
# blocked SSH/dbus entirely on this ordering). Empty assignment clears the
# accumulated Before= list from the base unit before re-adding only the
# udev-trigger ordering we still need.
Before=
Before=systemd-udev-trigger.service

# НАЙДЕНО 2026-07-24 (ЗАДАЧА 16): the After=/Wants=usb-moded-ssh.service pair
# that used to live here was DROPPED. Enabling this unit via
# sysinit.target.wants/ (see update-binary) creates a real ordering cycle:
# lxc-android-config (implicitly Before=sysinit.target via the .wants/
# symlink) -> sysinit.target -> usb-moded-ssh.service (ordered after
# sysinit.target by its own default deps) -> back to lxc-android-config via
# our own After=usb-moded-ssh.service. systemd-analyze verify confirmed
# this exact cycle live and silently deletes the usb-moded-ssh.service
# start job to break it -- meaning the ordering guarantee was never
# actually honored anyway once enabled this way. Not a real loss:
# usb-moded-ssh.service starts independently via a udev rule trigger (not
# normal target ordering), so by the time our own ExecStartPre sleep below
# elapses it is essentially always already up regardless of any explicit
# After= edge.

[Service]
ExecStartPre=/bin/sleep 7
