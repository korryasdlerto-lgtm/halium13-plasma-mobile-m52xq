[Unit]
# ПЕРЕДЕЛАНО 2026-07-27 (v25, перенесено в в2): по явному запросу --
# контейнер теперь НИКОГДА не стартует сам, ни по таймеру, ни по
# задержке. И ConditionPathExists+отдельный таймер (v22/v23), и
# ExecStartPre-задержка (v24) на живом первом боте после флеша так и не
# дали стабильного результата (SSH/карта ломались). Вместо очередной
# автоматики -- постоянная жёсткая блокировка: юнит стартует ТОЛЬКО
# если на /userdata вручную создан маркер CONTAINER_ENABLED. Это
# никогда не происходит само -- только через
# /usr/libexec/halium-enable-container.sh, который пользователь
# запускает вручную по ssh, когда сам решит поднять контейнер.
ConditionPathExists=/userdata/CONTAINER_ENABLED
