# FOUND 2026-07-29: usb-moded.service's base unit hardcodes
# Environment=USB_MODED_ARGS=-r (start in rescue/mass-storage mode),
# meant to be overridden here per the base unit's own comment ("Start in
# rescue mode, unless overridden by one of the env files below").
# device-specific-config.conf already documents this exact override
# (commented out, "Uncomment this to disable usb-moded's rescue mode")
# but was never actually enabled.
#
# Confirmed live via /data/usb-monitor.log across a full fresh-flash
# boot (225+ seconds captured): usb_moded starts fine (INIT DONE), the
# configfs gadget IS assembled correctly (c.1=[mass_storage.usb0,...]),
# but it comes up in mass-storage rescue mode, and EVERY subsequent
# attempt to live-switch it to rndis/developer mode via the D-Bus
# set_mode call (from halium-force-usb-developer-mode.sh's retry loop,
# and from usb-early-init-done.service's turn-usb-rescue-mode-off call)
# fails with "Error org.freedesktop.DBus.Error.Failed: set_mode",
# forever, never once succeeding -- live mode-switching a daemon that
# started in rescue mode appears to not actually work on this usb_moded
# build/version, regardless of how many retries or how long you wait.
#
# Fix: don't start in rescue mode at all -- boot directly into normal
# mode, no live switch needed. This file is loaded from
# /etc/default/usb-moded.d/*.conf (glob order, this file sorts after
# device-specific-config.conf so it wins).
USB_MODED_ARGS=""
