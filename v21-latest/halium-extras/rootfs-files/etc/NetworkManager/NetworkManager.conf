[main]
plugins=ifupdown,keyfile

[ifupdown]
managed=false

[device]
wifi.scan-rand-mac-address=no

# Mobile data (PDP context) currently does not activate on this modem/
# binder plugin (see fix docs, "Unexpected data call failure") -- left on
# autoconnect, NetworkManager retries it in a tight loop, which makes the
# global NM connectivity state flap between disconnected/unstable many
# times a second. That flapping prevents mission-control's GNetworkMonitor
# gate from ever settling into "online", which blocks voice calls/USSD
# dispatch even though they don't need mobile data at all. Disable
# autoconnect for the GSM profile until mobile data actually works.
[connection-mobile-noauto]
match-device=type:gsm
connection.autoconnect=false
