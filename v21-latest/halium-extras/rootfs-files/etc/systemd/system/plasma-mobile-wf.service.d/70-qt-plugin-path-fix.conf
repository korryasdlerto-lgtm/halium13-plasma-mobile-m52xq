[Service]
# НАЙДЕНО 2026-09-06: живая диагностика через ручной перезапуск
# plasmashell с включённым QT_LOGGING_RULES показала
# "/usr/bin/kf6/packagestructure/plasma_shell" not found и
# "starting invalid corona "org.kde.plasma.desktop"" -- корона шелла
# (десктоп + шторка + всё их содержимое) не грузится. Плагины
# (plasma_shell.so, plasma_lookandfeel.so) РЕАЛЬНО лежат на месте
# (/usr/lib/aarch64-linux-gnu/qt6/plugins/kf6/packagestructure/), но
# QT_PLUGIN_PATH не задан вообще НИГДЕ в системе (ни здесь, ни в
# /etc/environment, ни qt.conf) -- Qt6 откатывается искать плагины
# рядом с самим бинарником (/usr/bin/kf6/...), не находит, корона
# невалидна. Подтверждено живьём: с явным QT_PLUGIN_PATH ошибка
# "invalid corona"/"not found" исчезает полностью (вместе с
# PLASMA_DEFAULT_SHELL=org.kde.plasma.mobileshell, который и так уже
# экспортируется в /usr/bin/startplasmamobile -- без него плазма
# пытается грузить ДЕСКТОПНУЮ корону вместо мобильной, отдельная
# причина того же "invalid corona").
Environment=QT_PLUGIN_PATH=/usr/lib/aarch64-linux-gnu/qt6/plugins
