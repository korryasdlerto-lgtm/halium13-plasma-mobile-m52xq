[Service]
# Base unit has no Restart= at all (systemd default is Restart=no) -- if
# start-android-container crashes/exits non-zero, the Android container
# just stays dead for the rest of the boot, no second attempt. Added
# 2026-07-23 after a boot where host services (ssh/phosh) never showed
# even minimal overlay activity -- restart on failure with a short delay
# so a transient early-boot failure (bind-mount race, HAL not ready yet,
# etc.) gets retried instead of permanently killing the container for
# that boot.
Restart=on-failure
RestartSec=5
