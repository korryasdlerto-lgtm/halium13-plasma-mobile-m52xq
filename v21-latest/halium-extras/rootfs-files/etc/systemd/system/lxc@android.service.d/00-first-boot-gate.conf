[Unit]
# НАЙДЕНО 2026-08-01 (в7): наш предыдущий метод отключения автозапуска
# контейнера (закомментировать создание symlink'а в
# multi-user.target.wants/lxc@android.service внутри update-binary) НЕ
# оказался надёжным -- контейнер всё равно стартовал сам минимум
# один раз на в6 (подтверждено: pstore console-ramoops оборвался
# резко без "reboot: Power down", характерно для a660_zap hardware
# watchdog crash, который триггерится именно GPU-активностью
# контейнера). Symlink -- это только [Install]-путь; что-то ДРУГОЕ
# (возможная зависимость от android-service@hwcomposer.service или
# аналог, либо что-то запечённое в самом rootfs.img) смогло стартовать
# юнит в обход отключённого [Install]. Взят прямой рабочий паттерн из
# Дроидиан v25 (lxc-android-config.service.d/00-first-boot-gate.conf):
# жёсткая ConditionPathExists прямо в [Unit] -- systemd проверяет её
# ПРИ ЛЮБОЙ попытке старта юнита, независимо от того, кто и как его
# запрашивает (symlink, зависимость другого юнита, ручной systemctl
# start). Маркер-файл никогда не создаётся сам -- только вручную через
# /usr/libexec/halium-enable-container.sh.
ConditionPathExists=/userdata/CONTAINER_ENABLED
