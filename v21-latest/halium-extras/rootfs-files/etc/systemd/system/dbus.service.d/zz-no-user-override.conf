[Service]
# RE-APPLIED 2026-07-23: with /dev/null permissions and the missing
# "radio" user both fixed, dbus-daemon now fails one layer deeper:
# "Failed to start message bus: Failed to drop capabilities: Operation
# not permitted". systemd's User=messagebus/Group=messagebus (base
# unit) already drops privileges + AmbientCapabilities=CAP_AUDIT_WRITE
# BEFORE exec'ing dbus-daemon -- but dbus-daemon's own startup code
# (per its embedded default config, no /etc/dbus-1/system.conf exists
# on this image) ALSO tries to drop from root to messagebus internally,
# assuming it started with the full capability set. A second drop
# attempt from an already-restricted process fails. Resetting User=/
# Group= here lets dbus-daemon start as root and manage its own
# complete privilege+capability drop, like a classic non-systemd dbus
# deployment.
User=
Group=
