[Service]
# ADDED 2026-07-23: dbus-daemon exits with "Failed to start message
# bus: Failed to drop capabilities: Operation not permitted" on every
# single start (confirmed even with User=/Group= reset to empty --
# dbus-daemon starts as literal root, still fails). Matches a
# documented real-world dbus bug (RH bugzilla #1115533): dbus-daemon's
# internal capng_change_id() call explicitly tries to ADD
# CAP_AUDIT_WRITE to its effective/permitted capability set, and this
# specific step fails with EPERM if the kernel/environment doesn't
# actually support granting that capability (e.g. no functional audit
# subsystem -- plausible on this downstream Android/Qualcomm kernel).
# The base dbus.service unit sets AmbientCapabilities=CAP_AUDIT_WRITE,
# which is very likely what's driving dbus-daemon to attempt this in
# the first place. Clear it.
AmbientCapabilities=
