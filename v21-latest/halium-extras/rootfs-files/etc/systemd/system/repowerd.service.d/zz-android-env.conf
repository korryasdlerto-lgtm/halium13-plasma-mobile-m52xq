# 2026-07-16: repowerd links against libdeviceinfo0, which bridges to
# Android's property system via libhybris to detect the device codename
# and thus which /etc/deviceinfo/devices/<name>.yaml to load. Without
# these vars repowerd failed with "library libc.so not found" ->
# "falling back own property implementation" -> "No device yaml config
# found!" and silently used a generic desktop fallback profile (GridUnit
# 8, DeviceType desktop) instead of our real m52xq config -- meaning
# BacklightSysfsPath/FlashlightSysfsPath were never read at all. Same
# recurring env-var gap fixed elsewhere today for bluebinder/ofonod/
# pulseaudio/sensorfwd, just never applied to repowerd before.
[Service]
Environment=ANDROID_ROOT=/android
Environment=LD_LIBRARY_PATH=/android/system/lib64:/android/system/system/lib64
Environment=HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64
Environment=LD_PRELOAD=libtls-padding.so
# 2026-07-16: the base unit has no Restart= at all (defaults to "no") --
# confirmed live that a boot-time repowerd crash (in this case, from the
# libgbinder.so corruption bug, see update-binary safety net) left it
# sitting in `systemctl status` failed state for the rest of the
# session with brightness/flashlight silently non-functional the whole
# time and nothing ever retrying it. Defense in depth: retry a few
# times on failure in case some other transient issue causes a crash
# in the future, instead of dying permanently on the first one.
Restart=on-failure
RestartSec=5
