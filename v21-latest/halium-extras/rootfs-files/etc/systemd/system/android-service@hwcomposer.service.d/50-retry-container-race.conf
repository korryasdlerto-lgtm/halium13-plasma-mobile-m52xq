# FOUND 2026-07-31 (в5): with lxc@android.service auto-started, this
# service still races the container's own internal boot (mount hooks
# populating /system/etc/init, /vendor/etc/init inside the container
# namespace) -- "Unable to detect service" / exit 1 if it fires too
# early. The unit starting != the container being ready. Retry instead
# of requiring a manual `systemctl start` once the container catches up.
#
# FOUND AGAIN, same session: an earlier version of this drop-in used
# RestartSec=1 + StartLimitBurst=30 (~30s theoretical window) -- live
# testing showed all 30 restarts firing within the SAME SECOND
# ("Scheduled restart job immediately on client request", journal
# timestamps identical down to the second) and hitting "Start request
# repeated too quickly" well before the container had any realistic
# chance to be ready (observed: container needs 60-120s to populate
# /android/system/system/etc/init). RestartSec was NOT being honored
# as a real delay in this observed case. Fix: much longer RestartSec
# (5s, so even a burst of 30 spans 150s -- comfortably past the
# container's observed worst-case readiness time) and a correspondingly
# wider StartLimitIntervalSec so the burst budget doesn't reset mid-way.
[Unit]
StartLimitIntervalSec=300
StartLimitBurst=40

[Service]
Restart=on-failure
RestartSec=5
