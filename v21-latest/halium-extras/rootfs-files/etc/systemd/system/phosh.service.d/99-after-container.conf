[Unit]
# phoc's hwcomposer backend connects to the container's HAL exactly once at
# startup -- if the container isn't up yet, phoc "succeeds" (creates the
# backend, adds an HWCOMPOSER-1 output) but never gets real frames, leaving
# the panel frozen on whatever was last drawn (bootloader logo). Confirmed
# live 2026-07-23: manually starting phosh before the container required a
# full phosh.service restart afterward to actually show a desktop. Ordering
# after (not requiring -- container can be legitimately stopped/masked)
# avoids the race on a normal boot where both are starting around the same
# time.
After=lxc-android-config.service
