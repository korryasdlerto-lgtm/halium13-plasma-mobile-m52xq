[Unit]
# Живой тест v26 (фикс. вайп + позднее ручное включение контейнера):
# pulseaudio.service (пользовательский юнит) стартует НЕЗАВИСИМО от
# lxc-android-config.service -- никакого After=/ожидания контейнера
# нет вообще. На чистом вайпе, где контейнер по гейту не стартует сам
# (ConditionPathExists=/userdata/CONTAINER_ENABLED), pulseaudio падает
# SIGSEGV на самом первом старте (Android-мост ещё не готов),
# systemd's default StartLimitBurst=5 исчерпывается почти мгновенно
# ("Start request repeated too quickly"), юнит остаётся мёртвым до
# ручного `systemctl --user restart pulseaudio.service`. Тот же самый
# класс race, что уже чинили для usb-moded.service (zz-startlimit-
# retry.conf) -- увеличиваем окно retry, чтобы pulseaudio сам дожил
# до момента, когда контейнер/vendor-мост реально готовы (обычный
# halium-pulseaudio-sink-watchdog.sh тоже помогает, но он на таймере
# и не спасает уже "умерший" от исчерпанного лимита юнит).
StartLimitIntervalSec=180
StartLimitBurst=20

[Service]
RestartSec=3
