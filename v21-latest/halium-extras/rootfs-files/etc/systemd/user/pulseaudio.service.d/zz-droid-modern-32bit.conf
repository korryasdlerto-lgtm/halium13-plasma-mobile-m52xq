[Service]
# Type=notify (базовый юнит) ждёт sd_notify(READY=1) от демона -- эта
# сборка pulseaudio его не шлёт, из-за чего systemd 90с спустя убивает
# УЖЕ РАБОЧИЙ процесс (TimeoutStartSec). Type=simple = "запустился, и ладно".
Type=simple
LockPersonality=no
MemoryDenyWriteExecute=no
NoNewPrivileges=no
RestrictNamespaces=no
SystemCallFilter=
SystemCallArchitectures=

# в12, НАЙДЕНО 2026-09-07 (живой тест первого запуска звука на в11 после
# того, как ro-root фикс наконец дал контейнеру реально подняться):
# этот файл скопирован с Droidian verbatim и раньше здесь были ЕЩЁ 4
# строки Environment=, все КОНФЛИКТУЮЩИЕ с правильными значениями из
# usr/lib/systemd/user/pulseaudio.service.d/ubuntu-touch.conf --
# systemd применяет дропины по алфавиту (ubuntu-touch.conf раньше zz-
# droid-modern-32bit.conf), значит именно ЭТОТ файл выигрывал:
#   Environment=ANDROID_ROOT=/android                          -- совпадал, не проблема
#   Environment=HYBRIS_LD_LIBRARY_PATH=/system/lib/bootstrap:/system/lib:/vendor/lib
#     -- ЛОМАЛ звук: это droidian-путь (32-битные Android-либы
#     напрямую), а не путь моста этого проекта
#     (/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/
#     vendor-lib64 из ubuntu-touch.conf) -- pulseaudio (64-бит) грузил
#     32-битную /system/lib/libhardware.so и падал в SIGSEGV на КАЖДОМ
#     старте (rестарт-цикл, счётчик рестартов рос бесконечно)
#   Environment=LD_PRELOAD=                                    -- пустое значение
#     затирало LD_PRELOAD=libtls-padding.so из ubuntu-touch.conf
#   Environment=PULSE_MODULES_DROID_EXTRA_CARD_ARGS=            -- пустое значение
#     затирало config=/etc/pulse/halium-overrides/
#     audio_policy_configuration.xml из ubuntu-touch.conf -- из-за
#     этого module-droid-card читал НЕПАТЧЕНЫЙ
#     /vendor/etc/audio_policy_configuration.xml вместо копии с
#     вырезанными проблемными mixPorts (см. FIXES-V21-AUDIO.md) --
#     "We only support audioPolicyConfiguration version 1.0. Expect
#     problems." в логе, тоже часть причины падения.
# Все 4 строки удалены -- ubuntu-touch.conf's значения теперь ничем не
# перекрыты. См. также правку в /etc/pulse/default.pa (явный
# config= аргумент у load-module module-droid-card -- сам механизм
# PULSE_MODULES_DROID_EXTRA_CARD_ARGS в этом Debian-рутфс мёртвый,
# соответствующий touch.pa+хелпер сознательно не портированы, см.
# комментарий в ubuntu-touch.conf).
