[Service]
# в14, НАЙДЕНО 2026-09-08: bluebinder.service вообще не имел
# Environment= -- ExecStartPost=/usr/bin/droid/bluebinder_post.sh
# вызывает `getprop` для получения MAC-адреса Bluetooth, а без
# HYBRIS_LD_LIBRARY_PATH тот падает с "library libc.so not found"
# (не может загрузить bionic) и просто ничего не возвращает --
# отсюда ExecStartPost всегда завершался status=1/FAILURE, и
# Bluetooth-контроллер никогда не появлялся ни в bluetoothctl, ни в
# каком-либо UI (сам bluez был поставлен в в13, но без этого
# оставался бесполезен -- "No default controller available").
# Тот же самый мост, что уже используют pulseaudio/plasma-mobile-wf
# (см. usr/lib/systemd/user/pulseaudio.service.d/ubuntu-touch.conf,
# etc/systemd/system/plasma-mobile-wf.service.d/60-hybris-ld-path.conf).
Environment=HYBRIS_LD_LIBRARY_PATH=/opt/halium-lxc-bridge/system-lib64:/opt/halium-lxc-bridge/vendor-lib64
Environment=ANDROID_ROOT=/android
